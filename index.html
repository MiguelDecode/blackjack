<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="src/styles.css" />

    <title>03-vite-app</title>
  </head>
  <body>
    <header class="title">
      <h1>Blackjack</h1>
    </header>

    <div class="row mt-2">
      <div class="col text-center">
        <button class="btn btn-danger" id="btnNewGame">New Game</button>
        <button class="btn btn-primary" id="btnGetCard">Get Card</button>
        <button class="btn btn-primary" id="btnStopGame">Stop Game</button>
      </div>
    </div>

    <div class="row container mt-2">
      <div class="col">
        <h1>Player 1 - <small id="player-points">0</small></h1>
        <div class="row" id="player-cards"></div>
      </div>
    </div>

    <div class="row container mt-2">
      <div class="col">
        <h1>Computer - <small id="computer-points">0</small></h1>
        <div class="row" id="computer-cards"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
