<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#072a20" />
    <meta
      name="description"
      content="A classic casino-style Blackjack game built with vanilla JavaScript and Vite."
    />
    <title>Blackjack · 21</title>
  </head>
  <body>
    <main class="table">
      <header class="brand">
        <p class="brand__suits" aria-hidden="true">
          <span class="suit suit--red">♥</span>
          <span class="suit">♠</span>
          <span class="suit suit--red">♦</span>
          <span class="suit">♣</span>
        </p>
        <h1 class="brand__title">Blackjack</h1>
        <p class="brand__tagline">Dealer vs Player · 21</p>
      </header>

      <section class="scoreboard" aria-label="Scoreboard">
        <article class="seat seat--player">
          <h2 class="seat__name">Player 1</h2>
          <p class="seat__score">
            <span class="score" id="player-points">0</span>
          </p>
        </article>

        <p class="scoreboard__divider" aria-hidden="true">vs</p>

        <article class="seat seat--computer">
          <h2 class="seat__name">Computer</h2>
          <p class="seat__score">
            <span class="score" id="computer-points">0</span>
          </p>
        </article>
      </section>

      <section class="board" aria-label="Card table">
        <div class="hand hand--computer">
          <h2 class="hand__label">Computer hand</h2>
          <div class="hand__cards" id="computer-cards"></div>
        </div>

        <div class="hand hand--player">
          <h2 class="hand__label">Your hand</h2>
          <div class="hand__cards" id="player-cards"></div>
        </div>
      </section>

      <div class="controls">
        <button class="btn btn--ghost" id="btnNewGame" type="button">
          New Game
        </button>
        <button class="btn btn--primary" id="btnGetCard" type="button">
          Get Card
        </button>
        <button class="btn btn--danger" id="btnStopGame" type="button">
          Stop Game
        </button>
      </div>

      <div class="result" id="result" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
